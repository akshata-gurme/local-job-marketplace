<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkLocal - Best Performer of Week</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            margin: auto;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        .header-icon {
            font-size: 3.5rem;
            color: #2e7d32;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #2e7d32, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-title {
            color: #1e3c72;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .star-rating {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .star {
            font-size: 2.5rem;
            color: #ddd;
            cursor: pointer;
            transition: 0.3s;
        }

        .star.active {
            color: #ffd700;
        }

        .form-label {
            font-weight: 600;
            color: #444;
            text-align: left;
            margin-bottom: 10px;
        }

        .form-control {
            border-radius: 15px;
            padding: 12px 15px;
            border: 2px solid #eee;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .btn-submit {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            width: 100%;
            transition: 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 60, 114, 0.4);
        }

        .leaderboard {
            margin-top: 30px;
            text-align: left;
        }

        .leader-item {
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-icon"><i class="fas fa-crown"></i></div>
        <h1 class="main-title">Best Worker of Week</h1>
        <p class="subtitle">Vote for top performers in your area</p>

        <form id="voteForm">
            <div class="mb-3">
                <label class="form-label">Worker Name</label>
                <input type="text" id="workerName" class="form-control" placeholder="Enter worker name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Skill</label>
                <select id="workerSkill" class="form-control">
                    <option value="">Select skill</option>
                    <option>Agri Labor</option>
                    <option>Security</option>
                    <option>Housekeeping</option>
                    <option>Labourer</option>
                    <option>Cleaner/Maid</option>
                    <option>Peon/Helper</option>
                    <option>Electrician</option>
                    <option>Carpenter</option>
                    <option>Plumber</option>
                </select>
            </div>

            <div>
                <label class="form-label">Rate (1-5 Stars)</label>
                <div class="star-rating">
                    <span class="star" data-rating="1">★</span>
                    <span class="star" data-rating="2">★</span>
                    <span class="star" data-rating="3">★</span>
                    <span class="star" data-rating="4">★</span>
                    <span class="star" data-rating="5">★</span>
                </div>
                <input type="hidden" id="rating" value="0">
            </div>

            <button type="submit" class="btn-submit mt-4">Vote & Submit</button>
        </form>

        <div id="leaderboard" class="leaderboard" style="display: none;">
            <h4>Weekly Top Performers</h4>
            <div id="leaderList"></div>
        </div>
    </div>

    <script>
        let currentRating = 0;

        // Star rating logic
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', () => {
                currentRating = star.dataset.rating;
                document.getElementById('rating').value = currentRating;
                document.querySelectorAll('.star').forEach(s => {
                    s.classList.toggle('active', s.dataset.rating <= currentRating);
                });
            });
        });

        // Vote form
        document.getElementById('voteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (currentRating === 0) return alert('Please select rating');

            const formData = {
                name: document.getElementById('workerName').value,
                skill: document.getElementById('workerSkill').value,
                rating: currentRating
            };

            try {
                const response = await fetch('/api/best-performer', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(formData)
                });
                const result = await response.json();
                alert(result.message);
                document.getElementById('voteForm').reset();
                currentRating = 0;
                loadLeaderboard();
            } catch (error) {
                alert('Vote failed. Try again.');
            }
        });

        // Load leaderboard
        async function loadLeaderboard() {
            try {
                const response = await fetch('/api/best-performer');
                const leaders = await response.json();
                const list = document.getElementById('leaderList');
                if (leaders.length) {
                    document.getElementById('leaderboard').style.display = 'block';
                    list.innerHTML = leaders.map(l => `
                        <div class="leader-item">
                            <span><strong>${l.name}</strong> - ${l.skill}</span>
                            <span>${'★'.repeat(l.rating)}</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Leaderboard error');
            }
        }

        loadLeaderboard();
    </script>
</body>
</html>
