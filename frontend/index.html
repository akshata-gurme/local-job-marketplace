<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WorkLocal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Background: High-quality labor image with a gradient overlay */
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(79, 70, 229, 0.7)), 
                        url('https://images.unsplash.com/photo-1541888946425-d81bb19480c5?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        /* The Main White Card */
        .login-card {
            background: white;
            display: flex;
            width: 85%;
            max-width: 900px;
            height: 500px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        /* Left Side: Gradient Branding & Categories */
        .card-visual {
            flex: 1;
            background: linear-gradient(135deg, #1e3a8a 0%, #4f46e5 100%); /* Blue to Purple Gradient */
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
        }

        .card-visual h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .card-visual p {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* Skill Category Grid */
        .skill-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .skill-item {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            backdrop-filter: blur(5px); /* Adds a modern frosted glass effect */
        }

        /* Right Side: Interactive Form */
        .card-form {
            flex: 1.2;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
        }

        .card-form h2 {
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .card-form .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 40px;
        }

        /* Input Group Styling */
        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
            background: #f8fafc;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* Submit Button */
        .btn-login {
            background: #1e3a8a;
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.2);
        }

        .btn-login:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 58, 138, 0.3);
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #64748b;
            text-align: center;
        }

        .footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .login-card { flex-direction: column; height: auto; }
            .card-visual { padding: 30px; text-align: center; }
            .skill-grid { display: none; }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="goBack()">Back</button>

    <div class="login-card">
        <div class="card-visual">
            <h1>WorkLocal</h1>
            <p>Your local gateway to skilled and unskilled opportunities in Latur,Chakur, Udgir & Nilanga.</p>
            
            <div class="skill-grid">
                <div class="skill-item">🏗️ Construction</div>
                <div class="skill-item">🚰 Plumbing</div>
                <div class="skill-item">🧹 Cleaning</div>
                <div class="skill-item">⚡ Electrician</div>
            </div>
        </div>

        <div class="card-form">
            <h2>Welcome To WorkLocal</h2>
            <p class="subtitle">Log in to access your  account.</p>

            <form id="loginForm">
                <div class="input-group">
                    <label>Phone or Email</label>
                    <input type="text" name="username" placeholder="Enter details" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>

            <p class="footer">
                Don't have an account? <a href="login.html">Register</a>
            </p>
            <p class="footer" id="loginMessage"></p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginMessage = document.getElementById('loginMessage');
        const passwordInput = document.querySelector('input[name="password"]');

        passwordInput.placeholder = 'Enter password';

        loginForm.addEventListener('submit', async event => {
            event.preventDefault();

            const formData = new FormData(loginForm);
            const payload = {
                username: formData.get('username'),
                password: formData.get('password')
            };

            loginMessage.textContent = 'Checking account...';

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (!response.ok) {
                loginMessage.textContent = result.detail || 'Login failed.';
                return;
            }

            loginMessage.textContent = result.message + ' Redirecting...';
            setTimeout(() => {
                window.location.href = result.role === 'worker' ? 'worker.html' : 'employer.html';
            }, 1000);
        });

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
                return;
            }
            window.location.href = '/';
        }
    </script>
</body>
</html>
