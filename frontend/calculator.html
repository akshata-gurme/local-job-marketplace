<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkLocal - Wage Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            /* Light green gradient symbolizing opportunity for workers */
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .calc-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            margin: auto;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        .header-icon {
            font-size: 3rem;
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .main-title {
            color: #1e3c72;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .form-label {
            font-weight: 600;
            color: #444;
            display: block;
            text-align: left;
        }

        .form-control {
            border-radius: 15px;
            padding: 12px;
            border: 2px solid #eee;
            margin-bottom: 20px;
            font-size: 1.1rem;
            text-align: center;
        }

        .form-control:focus {
            border-color: #2e7d32;
            box-shadow: none;
        }

        .result-box {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 25px;
            border-radius: 20px;
            margin-top: 20px;
            display: none; /* Hidden until calculation */
        }

        .btn-calc {
            background: #ff9800; /* Bright orange for action */
            border: none;
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            width: 100%;
            transition: 0.3s;
        }

        .btn-calc:hover {
            background: #f57c00;
            transform: scale(1.02);
        }

        .voice-btn {
            background: #9b59b6;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="calc-card animate__animated animate__fadeIn">
        <div class="header-icon"><i class="fas fa-calculator"></i></div>
        <h2 class="main-title">Earnings Estimator</h2>
        <p class="text-muted mb-4">Calculate your total pay for jobs in Latur, Udgir, or Nilanga.</p>

        <div class="mb-3">
            <label class="form-label">Daily Wage (₹)</label>
            <input type="number" id="dailyWage" class="form-control" placeholder="e.g. 600" oninput="calculate()">
        </div>

        <div class="mb-3">
            <label class="form-label">Number of Days</label>
            <input type="number" id="totalDays" class="form-control" placeholder="e.g. 5" oninput="calculate()">
        </div>

        <div id="resultArea" class="result-box">
            <p class="mb-0 small">Estimated Total Earnings</p>
            <h1 id="totalEarnings" class="display-4 fw-bold mb-0">₹ 0</h1>
        </div>

        <button class="voice-btn" onclick="readEarnings()" title="Listen to Result">
            <i class="fas
